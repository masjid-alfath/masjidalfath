<header
  class="
    sticky top-0 z-50
    border-b border-white/[0.08]
    bg-midnight/85
    backdrop-blur-xl
  "
>
  <div class="container-site">

    <!-- Main Navbar -->
    <div class="flex h-[72px] items-center justify-between">

      <!-- Logo -->
      <a
        href="/"
        class="flex shrink-0 items-center"
        aria-label="Masjid Al-Fath — Beranda"
      >
        <!-- Light mode logo -->
        <img
          src="/images/logo/logo-light.svg"
          alt=""
          width="220"
          height="44"
          class="
            block
            h-9 w-auto
            sm:h-10
            lg:h-11
            dark:hidden
          "
        >

        <!-- Dark mode logo -->
        <img
          src="/images/logo/logo-dark.svg"
          alt=""
          width="220"
          height="44"
          class="
            hidden
            h-9 w-auto
            sm:h-10
            lg:h-11
            dark:block
          "
        >
      </a>


      <!-- Desktop Navigation -->
      {{ $path := .RelPermalink }}
      <nav
        class="hidden items-center gap-7 md:flex"
        aria-label="Navigasi utama"
      >
        <a
          href="/program/"
          class="nav-link{{ if hasPrefix $path "/program/" }} is-active{{ end }}"
          {{ if hasPrefix $path "/program/" }}aria-current="page"{{ end }}
        >
          Program
        </a>

        <a
          href="/agenda/"
          class="nav-link{{ if hasPrefix $path "/agenda/" }} is-active{{ end }}"
          {{ if hasPrefix $path "/agenda/" }}aria-current="page"{{ end }}
        >
          Agenda
        </a>

        <a
          href="/artikel/"
          class="nav-link{{ if hasPrefix $path "/artikel/" }} is-active{{ end }}"
          {{ if hasPrefix $path "/artikel/" }}aria-current="page"{{ end }}
        >
          Artikel
        </a>

        <a
          href="/tentang/"
          class="nav-link{{ if hasPrefix $path "/tentang/" }} is-active{{ end }}"
          {{ if hasPrefix $path "/tentang/" }}aria-current="page"{{ end }}
        >
          Tentang
        </a>

        <a
          href="/ziswaf/"
          class="btn-primary nav-ziswaf ml-1 text-sm{{ if hasPrefix $path "/ziswaf/" }} is-active{{ end }}"
          {{ if hasPrefix $path "/ziswaf/" }}aria-current="page"{{ end }}
        >
          ZISWAF
        </a>

        <button
          type="button"
          class="theme-toggle flex size-10 items-center justify-center rounded-xl border border-white/10 text-muted transition hover:bg-white/5 hover:text-white"
          aria-label="Ganti tema"
          title="Ganti tema"
        >
          <svg
            class="theme-icon-moon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
          </svg>

          <svg
            class="theme-icon-sun hidden"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
      </nav>


      <!-- Mobile Button -->
      <button
        id="mobile-menu-button"
        type="button"
        class="
          flex size-11
          items-center justify-center
          rounded-xl
          border border-white/10
          text-white
          transition
          hover:bg-white/5
          md:hidden
        "
        aria-label="Buka menu"
        aria-expanded="false"
        aria-controls="mobile-menu"
      >

        <!-- Hamburger -->
        <svg
          id="menu-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>

        <!-- Close -->
        <svg
          id="close-icon"
          class="hidden"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>

      </button>

    </div>


    <!-- Mobile Navigation -->
    <div
      id="mobile-menu"
      class="
        hidden
        border-t border-white/[0.08]
        pb-4 pt-3
        md:hidden
      "
      aria-hidden="true"
    >

      <nav
        class="flex flex-col gap-1"
        aria-label="Navigasi mobile"
      >
        <a
          href="/program/"
          class="mobile-nav-link{{ if hasPrefix $path "/program/" }} is-active{{ end }}"
          {{ if hasPrefix $path "/program/" }}aria-current="page"{{ end }}
        >
          <span>Program</span>
          {{ if hasPrefix $path "/program/" }}<span class="mobile-nav-dot" aria-hidden="true"></span>{{ end }}
        </a>

        <a
          href="/agenda/"
          class="mobile-nav-link{{ if hasPrefix $path "/agenda/" }} is-active{{ end }}"
          {{ if hasPrefix $path "/agenda/" }}aria-current="page"{{ end }}
        >
          <span>Agenda</span>
          {{ if hasPrefix $path "/agenda/" }}<span class="mobile-nav-dot" aria-hidden="true"></span>{{ end }}
        </a>

        <a
          href="/artikel/"
          class="mobile-nav-link{{ if hasPrefix $path "/artikel/" }} is-active{{ end }}"
          {{ if hasPrefix $path "/artikel/" }}aria-current="page"{{ end }}
        >
          <span>Artikel</span>
          {{ if hasPrefix $path "/artikel/" }}<span class="mobile-nav-dot" aria-hidden="true"></span>{{ end }}
        </a>

        <a
          href="/tentang/"
          class="mobile-nav-link{{ if hasPrefix $path "/tentang/" }} is-active{{ end }}"
          {{ if hasPrefix $path "/tentang/" }}aria-current="page"{{ end }}
        >
          <span>Tentang</span>
          {{ if hasPrefix $path "/tentang/" }}<span class="mobile-nav-dot" aria-hidden="true"></span>{{ end }}
        </a>

        <a
          href="/ziswaf/"
          class="mobile-ziswaf{{ if hasPrefix $path "/ziswaf/" }} is-active{{ end }}"
          {{ if hasPrefix $path "/ziswaf/" }}aria-current="page"{{ end }}
        >
          ZISWAF
        </a>

        <button
          type="button"
          class="
            theme-toggle
            mt-2
            flex
            items-center
            justify-between
            rounded-xl
            border border-white/10
            min-h-11
            px-3 py-2.5
            text-sm text-muted
            transition
            hover:bg-white/5
            hover:text-white
          "
          aria-label="Ganti tema"
        >
          <span>Tampilan</span>

          <span class="flex items-center gap-2">
            <span class="theme-label">Gelap</span>

            <svg
              class="theme-icon-moon"
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
            </svg>

            <svg
              class="theme-icon-sun hidden"
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
          </span>
        </button>

      </nav>

    </div>

  </div>
</header>
