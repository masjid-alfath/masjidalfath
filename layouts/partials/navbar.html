<header
  class="
    sticky top-0 z-50
    border-b border-white/[0.08]
    bg-midnight/85
    backdrop-blur-xl
  "
>
  <div class="container-site">

    <!-- Main Navbar -->
    <div class="flex h-[72px] items-center justify-between">

      <!-- Logo -->
      <a
        href="/"
        class="flex items-center gap-3"
        aria-label="Masjid Al-Fath"
      >
        <div
          class="
            flex size-10
            items-center justify-center
            rounded-xl
            bg-indigo
            text-sm font-bold text-white
          "
        >
          AF
        </div>

        <span class="font-bold tracking-[-0.02em]">
          Masjid Al-Fath
        </span>
      </a>


      <!-- Desktop Navigation -->
      <nav
        class="hidden items-center gap-7 md:flex"
        aria-label="Navigasi utama"
      >
        <a href="/program/" class="nav-link">Program</a>
        <a href="/agenda/" class="nav-link">Agenda</a>
        <a href="/artikel/" class="nav-link">Artikel</a>
        <a href="/tentang/" class="nav-link">Tentang</a>

        <a
          href="/ziswaf/"
          class="btn-primary ml-1 text-sm"
        >
          ZISWAF
        </a>

        <button
          type="button"
          class="theme-toggle flex size-10 items-center justify-center rounded-xl border border-white/10 text-muted transition hover:bg-white/5 hover:text-white"
          aria-label="Ganti tema"
          title="Ganti tema"
        >
          <svg
            class="theme-icon-moon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
          </svg>

          <svg
            class="theme-icon-sun hidden"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
      </nav>


      <!-- Mobile Button -->
      <button
        id="mobile-menu-button"
        type="button"
        class="
          flex size-10
          items-center justify-center
          rounded-xl
          border border-white/10
          text-white
          transition
          hover:bg-white/5
          md:hidden
        "
        aria-label="Buka menu"
        aria-expanded="false"
        aria-controls="mobile-menu"
      >

        <!-- Hamburger -->
        <svg
          id="menu-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>

        <!-- Close -->
        <svg
          id="close-icon"
          class="hidden"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>

      </button>

    </div>


    <!-- Mobile Navigation -->
    <div
      id="mobile-menu"
      class="
        hidden
        border-t border-white/[0.08]
        pb-4 pt-2
        md:hidden
      "
    >

      <nav
        class="flex flex-col gap-1"
        aria-label="Navigasi mobile"
      >

        <a
          href="/program/"
          class="
            rounded-xl
            px-3 py-2.5
            text-sm text-muted
            transition
            hover:bg-white/5
            hover:text-white
          "
        >
          Program
        </a>

        <a
          href="/agenda/"
          class="
            rounded-xl
            px-3 py-2.5
            text-sm text-muted
            transition
            hover:bg-white/5
            hover:text-white
          "
        >
          Agenda
        </a>

        <a
          href="/artikel/"
          class="
            rounded-xl
            px-3 py-2.5
            text-sm text-muted
            transition
            hover:bg-white/5
            hover:text-white
          "
        >
          Artikel
        </a>

        <a
          href="/tentang/"
          class="
            rounded-xl
            px-3 py-2.5
            text-sm text-muted
            transition
            hover:bg-white/5
            hover:text-white
          "
        >
          Tentang
        </a>

        <a
          href="/ziswaf/"
          class="
            mt-3
            flex
            items-center justify-center
            rounded-xl
            bg-indigo
            px-4 py-3
            text-sm font-semibold text-white
            transition
            hover:bg-indigo-hover
          "
        >
          ZISWAF
        </a>

        <button
          type="button"
          class="
            theme-toggle
            mt-2
            flex
            items-center
            justify-between
            rounded-xl
            border border-white/10
            px-3 py-2.5
            text-sm text-muted
            transition
            hover:bg-white/5
            hover:text-white
          "
          aria-label="Ganti tema"
        >
          <span>Tampilan</span>

          <span class="flex items-center gap-2">
            <span class="theme-label">Gelap</span>

            <svg
              class="theme-icon-moon"
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
            </svg>

            <svg
              class="theme-icon-sun hidden"
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
          </span>
        </button>

      </nav>

    </div>

  </div>
</header>
