{{ define "main" }}

<section class="py-20 lg:py-28">
  <div class="container-site">

    <p class="eyebrow text-aurora-cyan">
      Artikel
    </p>

    <h1
      class="
        mt-3
        text-4xl
        font-bold
        tracking-[-0.04em]
        lg:text-5xl
      "
    >
      {{ .Title }}
    </h1>

    <div class="mt-10 space-y-5">

      {{ range .Pages }}

        <article class="surface-card p-6">

          <h2 class="text-xl font-bold">
            <a
              href="{{ .RelPermalink }}"
              class="transition hover:text-aurora-cyan"
            >
              {{ .Title }}
            </a>
          </h2>

          {{ with .Summary }}
            <p class="mt-3 text-sm leading-6 text-muted">
              {{ . }}
            </p>
          {{ end }}

        </article>

      {{ end }}

    </div>

  </div>
</section>

{{ end }}
