{{- $value := .Get "value" -}}

<button
  type="button"
  class="content-copy"
  data-copy-value="{{ $value }}"
  aria-label="{{ .Inner | plainify }}"
>
  <span class="content-copy-icon" aria-hidden="true">
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="9" y="9" width="11" height="11" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
  </span>

  <span class="content-copy-label">
    {{- .Inner | markdownify -}}
  </span>

  <span
    class="content-copy-success hidden"
    aria-hidden="true"
  >
    ✓ Berhasil Disalin
  </span>
</button>
